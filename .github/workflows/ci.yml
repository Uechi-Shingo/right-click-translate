# 変更を push したとき・PR を作ったときに、監査と自動テストを自動で実行する。
# 公開リポジトリの GitHub Actions は、標準の実行環境（ubuntu-latest）なら無料。
# ブラウザを使う検証（tests/*-check.mjs・e2e-chatgpt.mjs）は、実際のブラウザが必要なので、手元で実行する。
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 読み取りだけの権限（リポジトリを書き換えられない）
permissions:
  contents: read

# 同じブランチで続けて push したとき、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 監査・自動テスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tools/make-release.ps1 が、配布前に実行するものと同じ。加えて、リポジトリの衛生検査。
      - name: 静的な監査（権限・通信先・CSP・禁止された書き方など）
        run: node tests/static-audit.mjs

      - name: 自動テスト（安全装置）
        run: node tests/security.test.mjs

      - name: 自動テスト（通信・翻訳動作・文脈）
        run: node tests/background.test.mjs

      - name: 自動テスト（ChatGPT のプラン）
        run: node tests/chatgpt.test.mjs

      - name: 自動テスト（併用・速さ優先）
        run: node tests/failover.test.mjs

      - name: 自動テスト（訳文の取り込み）
        run: node tests/roundtrip.test.mjs

      - name: リポジトリの検査（秘密情報・個人情報・配布物の整合）
        run: node tests/repo-hygiene.mjs
